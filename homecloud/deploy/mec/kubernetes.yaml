apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homecare-mec-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homecare-mec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homecare-mec
  template:
    metadata:
      labels:
        app: homecare-mec
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: REPLACE_WITH_REGISTRY/homecare-mec:1.1.0
          ports:
            - containerPort: 7000
          env:
            - name: MEC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homecare-mec-secrets
                  key: api-token
            - name: MEC_EVENT_STORE
              value: /data/mec_events.sqlite3
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homecare-mec-data
---
apiVersion: v1
kind: Service
metadata:
  name: homecare-mec
spec:
  selector:
    app: homecare-mec
  ports:
    - port: 7000
      targetPort: 7000

