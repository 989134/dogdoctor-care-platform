<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>銀髮守護犬｜照護中心</title>
<style>
:root{--ink:#163039;--muted:#667a80;--teal:#14737a;--teal2:#0b4f55;--paper:#fff;--bg:#edf4f2;--line:#d9e5e2;--red:#b91c1c;--shadow:0 16px 42px #183d4114}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Microsoft JhengHei",sans-serif}.shell{max-width:1240px;margin:auto;padding:24px}.topbar,.section-title,.video-status{display:flex;justify-content:space-between;gap:16px;align-items:center}.topbar{margin-bottom:18px}.brand h1{font-size:28px;margin:0 0 5px}.brand p,.section-title span,.small,.service-state,.feedback{margin:0;color:var(--muted)}.live-pill{display:flex;align-items:center;gap:8px;background:#dff7ed;color:#087154;padding:9px 14px;border-radius:999px;font-weight:750}.live-dot{width:9px;height:9px;border-radius:50%;background:#10b981;box-shadow:0 0 0 5px #10b98122}.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,.75fr);gap:18px}.video-panel,.med-panel,.chat-panel,.history-panel{padding:20px}.video-wrap{position:relative;border-radius:15px;overflow:hidden;background:#10272e;aspect-ratio:16/9}.video-wrap img{display:block;width:100%;height:100%;object-fit:contain}.rest-overlay{display:none;position:absolute;border:3px solid #38bdf8;background:#38bdf833;pointer-events:none}.video-status{padding:13px 4px 0}.status-detail{color:var(--muted);font-size:14px;text-align:right}.alerts{margin-top:14px}.event{border-left:5px solid #e7a029;background:#fff8e9;border-radius:10px;padding:13px 14px;margin-top:10px}.event.alert{border-color:var(--red);background:#fff0f0}.event p{margin:0 0 10px}.empty{padding:22px;text-align:center;color:var(--muted);background:#f4f8f7;border-radius:12px}.section-title{margin-bottom:15px}.section-title h2{font-size:20px;margin:0}.section-title span{font-size:13px}.medicine-list{display:grid;gap:10px}.medicine{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:12px}.medicine-time{font-size:19px;font-weight:800;color:var(--teal)}.medicine-name{font-weight:720}.medicine-days{font-size:12px;color:var(--muted);margin-top:3px}.medicine-actions,.actions,.chat-controls{display:flex;gap:7px;flex-wrap:wrap}.add-med{margin-top:16px;border-top:1px solid var(--line);padding-top:16px}.form-row{display:grid;grid-template-columns:1fr 115px;gap:8px}.days{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.days label{cursor:pointer}.days input{position:absolute;opacity:0}.days span{display:block;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:13px}.days input:checked+span{background:var(--teal);border-color:var(--teal);color:#fff}input{width:100%;border:1px solid #bdcfcb;border-radius:10px;padding:11px;font:inherit;color:inherit}button{border:0;border-radius:10px;background:var(--teal);color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}button:hover{background:var(--teal2)}button.secondary{background:#60747a}button.danger{background:var(--red)}button:disabled{opacity:.45;cursor:not-allowed}.feedback{min-height:20px;margin-top:8px;font-size:13px}.bad{color:var(--red)!important}.ok{color:#087154}.lower{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:18px}.chat-log{height:330px;overflow:auto;background:#f2f7f6;border-radius:14px;padding:14px}.chat-empty{color:var(--muted);text-align:center;padding-top:120px}.turn{display:flex;flex-direction:column;gap:7px;margin:12px 0}.bubble{max-width:84%;padding:10px 13px;border-radius:14px;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}.bubble.dog{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}.bubble small{display:block;opacity:.7;margin-top:5px}.chat-controls{margin-top:12px}.chat-input{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.service-state{font-size:13px;margin-top:10px}.history-wrap{overflow:auto;max-height:435px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted)}a{color:var(--teal)}details.advanced{margin-top:18px;padding:0 20px}details.advanced summary{cursor:pointer;font-weight:750;padding:18px 0}.advanced-body{border-top:1px solid var(--line);padding:18px 0 22px}.advanced-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.advanced-card{background:#f3f8f7;border-radius:13px;padding:14px}.advanced-card h3{margin:0 0 8px;font-size:16px}.small{font-size:13px;line-height:1.55}.critical-banner{position:fixed;z-index:100;top:12px;left:50%;transform:translateX(-50%);width:min(94vw,980px);padding:17px 22px;border:3px solid #7f1d1d;border-radius:15px;background:#dc2626;color:white;font-size:19px;font-weight:850;box-shadow:0 14px 38px #450a0a77}.critical-banner[hidden]{display:none}.follow-selecting{cursor:crosshair;outline:4px solid #f59e0b}
@media(max-width:900px){.hero,.lower{grid-template-columns:1fr}.advanced-grid{grid-template-columns:1fr 1fr}.video-wrap{aspect-ratio:4/3}}@media(max-width:600px){.shell{padding:13px}.brand h1{font-size:23px}.live-pill{font-size:12px}.advanced-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr 105px}.medicine{grid-template-columns:58px 1fr}.medicine-actions{grid-column:2}.chat-log{height:290px}.status-detail{display:none}.critical-banner{font-size:16px}}
</style></head><body>
<div id="criticalBanner" class="critical-banner" role="alert" aria-live="assertive" hidden></div>
<main class="shell"><header class="topbar"><div class="brand"><h1>銀髮守護犬</h1><p>即時照護中心</p></div><div class="live-pill"><span class="live-dot"></span><span id="topState">正在連線</span></div></header>
<div class="hero"><section class="panel video-panel"><div class="video-wrap"><img id="careImage" src="/care/video_feed" alt="照護即時影像"><div id="restOverlay" class="rest-overlay"></div></div><div class="video-status"><strong id="health">正在讀取即時影像…</strong><span id="poseSummary" class="status-detail">尚無姿態資料</span></div><div id="activeAlerts" class="alerts" aria-live="assertive"><div class="empty">目前沒有跌倒或久坐警報</div></div><div id="fallTips" class="event" hidden></div><p id="alertFeedback" class="feedback" role="status"></p></section>
<section class="panel med-panel"><div class="section-title"><h2>吃藥行事曆</h2><span>每日提醒</span></div><div id="medicineList" class="medicine-list"><div class="empty">正在讀取行事曆…</div></div><div class="add-med"><div class="form-row"><input id="medicineName" maxlength="60" placeholder="藥品名稱，例如：飯後藥"><input id="medicineTime" type="time" value="08:00"></div><div id="medicineDays" class="days"></div><input id="medicineNote" maxlength="120" placeholder="備註（選填）"><button style="margin-top:10px;width:100%" onclick="addMedication()">加入行事曆</button><p id="medicineFeedback" class="feedback" role="status"></p></div></section></div>
<div class="lower"><section class="panel chat-panel"><div class="section-title"><h2>語音聊天室</h2><button class="secondary" onclick="clearConversationLog()">清除紀錄</button></div><div id="robotConversationLog" class="chat-log" aria-live="polite"><div class="chat-empty">按「開始車上對話」，靠近車上的麥克風說話。</div></div><div class="chat-controls"><button id="robotTalkToggle" onclick="toggleRobotConversation()">開始車上對話</button><button id="computerMicButton" class="secondary" onclick="toggleComputerMic()">使用電腦麥克風</button></div><div class="chat-input"><input id="chatText" placeholder="也可以輸入文字和守護犬對話" onkeydown="if(event.key==='Enter')sendTextChat()"><button onclick="sendTextChat()">傳送</button></div><p id="conversationState" class="service-state">尚未開始</p><p id="robotVoiceFeedback" class="feedback" role="status"></p></section>
<section class="panel history-panel"><div class="section-title"><h2>最近照護事件</h2><span>保留原事件紀錄</span></div><div id="history" class="history-wrap">尚無已保存事件</div></section></div>
<details class="panel advanced"><summary>進階功能與設定</summary><div class="advanced-body"><div class="advanced-grid"><div class="advanced-card"><h3>影像隱私</h3><p id="privacyStatus" class="small">正在讀取…</p><div class="actions"><button id="privacySkeletonButton" onclick="setPrivacyMode('skeleton')">隱私骨架模式</button><button id="privacyVideoButton" class="secondary" onclick="setPrivacyMode('manual_video')">正常影像模式</button></div></div><div class="advanced-card"><h3>看見人就前進</h3><p id="followStatus" class="small">啟用後，看到任何人就向前；沒看到人或遇到危險立即停車。</p><div class="actions"><button id="followEnableButton" onclick="followAction('enable')">開始跟隨</button><button class="danger" onclick="followAction('stop')">停止跟隨</button></div></div><div class="advanced-card"><h3>環境校正</h3><p id="setupFeedback" class="small">設定床／沙發休息區可降低正常躺臥誤報。</p><div class="actions"><button onclick="setBaseline()">設定地面基準</button><button onclick="beginRestZone()">框選休息區</button><button class="secondary" onclick="clearRestZone()">清除休息區</button></div></div><div class="advanced-card"><h3>Gemini API</h3><p id="geminiStatus" class="small">正在讀取設定…</p><input id="geminiApiKey" type="password" maxlength="200" autocomplete="new-password" spellcheck="false" placeholder="貼上新的 Gemini API Key" style="margin-top:10px"><button style="margin-top:8px;width:100%" onclick="saveGeminiKey()">保存並立即套用</button><p id="geminiFeedback" class="feedback" role="status"></p></div></div></div></details></main>
<script>
const postureLabels={upper_body:'上半身觀察',upper_upright:'上半身直立',upper_bending:'上半身彎腰',upper_horizontal:'上半身接近水平',upper_resting:'在休息區休息',stream_unavailable:'影像中斷',no_person:'未取得清楚人體',camera_moving:'載具移動中',standing:'站立',sitting:'坐姿',bending:'彎腰',resting:'正常躺臥',lying_unverified:'躺臥待確認',suspected_fall:'疑似跌倒'};
const eventNames={tracking_review:'疑似跌倒，失去人體追蹤',fall:'疑似跌倒',prolonged_sitting:'久坐超過 10 秒',immobile:'久未移動',wandering:'疑似徘徊',path_obstacle:'通道障礙',possible_water:'疑似地面積水',gas_alarm:'瓦斯警報'},dayNames=['一','二','三','四','五','六','日'];
let selectingRest=false,restPoints=[],robotConversation=false,robotConversationBusy=false,computerListening=false,recognition=null,browserAssistantBusy=false;const conversationStorageKey='homecareRobotConversationV2';
async function postJson(url,body={},headers={}){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...headers},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.error||d.message||`操作失敗（HTTP ${r.status}）`);return d}function feedback(id,text,bad=false){const e=document.getElementById(id);e.textContent=text;e.classList.toggle('bad',bad)}
function readConversation(){try{return JSON.parse(localStorage.getItem(conversationStorageKey)||'[]')}catch(e){return []}}function renderConversation(){const root=document.getElementById('robotConversationLog'),items=readConversation();root.replaceChildren();if(!items.length){root.innerHTML='<div class="chat-empty">按「開始車上對話」，靠近車上的麥克風說話。</div>';return}for(const item of items){const turn=document.createElement('div');turn.className='turn';for(const [label,text,kind] of [['你',item.transcript,'user'],['守護犬',item.reply,'dog']]){const b=document.createElement('div');b.className='bubble '+kind;b.append(document.createTextNode(label+'：'+text));if(kind==='dog'){const t=document.createElement('small');t.textContent=new Date(item.time).toLocaleString('zh-TW');b.appendChild(t)}turn.appendChild(b)}root.appendChild(turn)}root.scrollTop=root.scrollHeight}function appendConversation(transcript,reply){const a=readConversation();a.push({transcript,reply,time:Date.now()});localStorage.setItem(conversationStorageKey,JSON.stringify(a.slice(-50)));renderConversation()}function clearConversationLog(){localStorage.removeItem(conversationStorageKey);renderConversation()}function state(text,bad=false){const e=document.getElementById('conversationState');e.textContent=text;e.className='service-state '+(bad?'bad':'')}
async function waitSpeech(){for(let i=0;i<90;i++){await new Promise(r=>setTimeout(r,500));try{const r=await fetch('/care/audio/status',{cache:'no-store'}),d=await r.json(),s=d.robot?.speaker||{};if(!s.speaking&&!(s.queue_depth>0))return}catch(e){}}}async function askAssistant(text){if(!text||browserAssistantBusy)return;browserAssistantBusy=true;state('Gemini 正在思考…');try{const d=await postJson('/care/assistant',{text,speak_on_robot:true});appendConversation(text,d.reply);if(!d.speaker?.sent)throw Error(d.speaker?.error||'回答未送到車上喇叭');state('守護犬正在由車上喇叭回答…');await waitSpeech();state(computerListening?'電腦麥克風聆聽中':'對話完成')}catch(e){state(e.message,true)}finally{browserAssistantBusy=false}}function sendTextChat(){const i=document.getElementById('chatText'),t=i.value.trim();if(t){i.value='';askAssistant(t)}}
async function runRobotTurn(){if(robotConversationBusy||!robotConversation)return;robotConversationBusy=true;state('正在聆聽車上麥克風…');try{const d=await postJson('/care/assistant/voice-turn',{duration:6});appendConversation(d.transcript,d.reply);state('守護犬正在回答…');await waitSpeech()}catch(e){state(e.message,true)}finally{robotConversationBusy=false}if(robotConversation)setTimeout(runRobotTurn,700)}async function toggleRobotConversation(){if(robotConversation){robotConversation=false;document.getElementById('robotTalkToggle').textContent='開始車上對話';state('對話已停止');postJson('/care/audio/stop',{}).catch(()=>{});return}stopComputerMic();robotConversation=true;document.getElementById('robotTalkToggle').textContent='停止車上對話';await postJson('/care/assistant/reset',{}).catch(()=>{});runRobotTurn()}function stopComputerMic(){computerListening=false;if(recognition)try{recognition.stop()}catch(e){}document.getElementById('computerMicButton').textContent='使用電腦麥克風'}function toggleComputerMic(){if(computerListening){stopComputerMic();state('電腦麥克風已停止');return}if(robotConversation)toggleRobotConversation();const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){state('此瀏覽器不支援語音辨識',true);return}computerListening=true;document.getElementById('computerMicButton').textContent='停止電腦麥克風';recognition=new SR();recognition.lang='zh-TW';recognition.continuous=true;recognition.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.trim(),x=t.replace(/\s/g,'');if(/我沒事|取消警報|不用幫忙/.test(x))sendFallResponse('ok',t);else if(/救命|幫我|緊急|好痛|不能起來/.test(x))sendFallResponse('help',t);else askAssistant(t)};recognition.onerror=e=>state('麥克風：'+e.error,true);recognition.onend=()=>{if(computerListening)setTimeout(()=>{try{recognition.start()}catch(e){}},500)};recognition.start();state('電腦麥克風聆聽中')}
function initDays(){const root=document.getElementById('medicineDays');dayNames.forEach((n,i)=>{const l=document.createElement('label'),c=document.createElement('input'),s=document.createElement('span');c.type='checkbox';c.value=i;c.checked=true;s.textContent='週'+n;l.append(c,s);root.appendChild(l)})}async function loadMedications(){try{const r=await fetch('/care/medications',{cache:'no-store'}),d=await r.json(),root=document.getElementById('medicineList');root.replaceChildren();if(!d.medications?.length){root.innerHTML='<div class="empty">尚未設定吃藥時間</div>';return}for(const m of d.medications){const card=document.createElement('div');card.className='medicine';const at=document.createElement('div');at.className='medicine-time';at.textContent=m.time;const info=document.createElement('div'),name=document.createElement('div'),days=document.createElement('div');name.className='medicine-name';name.textContent=m.name;days.className='medicine-days';days.textContent=(m.days.length===7?'每天':m.days.map(d=>'週'+dayNames[d]).join('、'))+(m.note?'｜'+m.note:'');info.append(name,days);const acts=document.createElement('div');acts.className='medicine-actions';for(const [label,klass,fn] of [['提醒','',()=>remindMedication(m.id)],['刪除','secondary',()=>removeMedication(m.id)]]){const b=document.createElement('button');b.className=klass;b.textContent=label;b.onclick=fn;acts.appendChild(b)}card.append(at,info,acts);root.appendChild(card)}}catch(e){document.getElementById('medicineList').innerHTML='<div class="empty bad">行事曆讀取失敗</div>'}}async function addMedication(){const days=[...document.querySelectorAll('#medicineDays input:checked')].map(e=>+e.value);try{const d=await postJson('/care/medications',{name:document.getElementById('medicineName').value,time:document.getElementById('medicineTime').value,days,note:document.getElementById('medicineNote').value},{'X-Care-Medication':'1'});feedback('medicineFeedback',d.message);document.getElementById('medicineName').value='';document.getElementById('medicineNote').value='';loadMedications()}catch(e){feedback('medicineFeedback',e.message,true)}}async function removeMedication(id){try{const r=await fetch('/care/medications/'+id,{method:'DELETE',headers:{'X-Care-Medication':'1'}}),d=await r.json();if(!r.ok)throw Error(d.error||'刪除失敗');feedback('medicineFeedback',d.message);loadMedications()}catch(e){feedback('medicineFeedback',e.message,true)}}async function remindMedication(id){try{const d=await postJson('/care/medications/'+id+'/remind',{}, {'X-Care-Medication':'1'});feedback('medicineFeedback',d.message)}catch(e){feedback('medicineFeedback',e.message,true)}}
function eventIsCancelled(event){return event.status==='cancelled'}
function critical(events){const b=document.getElementById('criticalBanner'),e=[...events].reverse().find(e=>['fall','tracking_review','prolonged_sitting'].includes(e.kind)&&['pending','review','alert'].includes(e.status));if(!e){b.hidden=true;return}b.textContent=e.kind==='prolonged_sitting'?'紅色警示：連續坐姿已超過 10 秒，請立即確認長者狀況。':'紅色警示：偵測到疑似跌倒，請立即確認安全。';b.hidden=false}function renderAlerts(events){const root=document.getElementById('activeAlerts'),a=events.filter(e=>['pending','review','alert'].includes(e.status)&&['fall','tracking_review','prolonged_sitting'].includes(e.kind));root.replaceChildren();if(!a.length){root.innerHTML='<div class="empty">目前沒有跌倒或久坐警報</div>';return}for(const e of a){const box=document.createElement('div');box.className='event alert';const p=document.createElement('p');p.innerHTML='<strong>'+eventNames[e.kind]+'</strong><br>'+(e.kind==='prolonged_sitting'?'已連續坐姿超過 10 秒，請查看現場狀況。':e.status==='alert'?'未收到取消或重新站立，已升級為高風險。':`等待回應，約 ${e.remaining_seconds??0} 秒後升級。`);box.appendChild(p);if(['fall','tracking_review'].includes(e.kind)&&e.status!=='alert'){const h=document.createElement('button');h.className='danger';h.textContent='需要協助／立即通知';h.onclick=()=>sendFallResponse('help','介面按鈕');box.appendChild(h)}const c=document.createElement('button');c.className='secondary';c.textContent=e.kind==='prolonged_sitting'?'已確認':'我沒事／取消警報';c.onclick=()=>cancelEvent(e.id);box.appendChild(c);root.appendChild(box)}}async function sendFallResponse(response,heard){try{const d=await postJson('/care/fall-response',{response});feedback('alertFeedback',`辨識到「${heard}」：${d.message}`);refreshStatus()}catch(e){feedback('alertFeedback',e.message,true)}}async function cancelEvent(id){try{const d=await postJson(`/care/events/${id}/cancel`,{});feedback('alertFeedback',d.message||'警報已取消');refreshStatus();refreshHistory()}catch(e){feedback('alertFeedback',e.message,true)}}function tips(events){const r=document.getElementById('fallTips'),e=events.find(x=>['fall','tracking_review'].includes(x.kind)&&['pending','review','alert'].includes(x.status));r.hidden=!e;if(e)r.innerHTML='<strong>跌倒後安全小貼士</strong><br>先確認意識與疼痛，不要急著拉起。若頭部撞擊、劇痛、無法站起或意識不清，請立即求援。'}
async function refreshStatus(){try{const r=await fetch('/care/status',{cache:'no-store'}),s=await r.json();if(!r.ok)throw Error();document.getElementById('topState').textContent=s.stream_stale?'影像中斷':'照護監測中';document.getElementById('health').textContent=s.error||(s.stream_stale?'影像中斷／正在重連':`即時影像 · 約 ${s.pose_fps} FPS`);document.getElementById('poseSummary').textContent=`${postureLabels[s.posture]||s.posture||'未辨識'}｜坐姿 ${Number(s.sitting_seconds||0).toFixed(1)} 秒`;critical(s.events||[]);renderAlerts(s.events||[]);tips(s.events||[]);renderRestZone((s.settings?.rest_zones||[])[0]);renderFollow(s.follow||{})}catch(e){document.getElementById('topState').textContent='服務離線';document.getElementById('health').textContent='監測服務連線失敗'}}async function refreshHistory(){try{const r=await fetch('/care/events/history?limit=10',{cache:'no-store'}),d=await r.json(),root=document.getElementById('history');if(!r.ok||!d.events?.length){root.textContent='尚無已保存事件';return}const states={pending:'等待確認',review:'人工確認',alert:'高風險',cancelled:'已取消',recovered:'已恢復',cleared:'已解除'},table=document.createElement('table'),head=document.createElement('tr');for(const t of ['時間','事件','狀態','影像']){const th=document.createElement('th');th.textContent=t;head.appendChild(th)}table.appendChild(head);for(const e of d.events){const row=document.createElement('tr');for(const v of [new Date(e.created_wall*1000).toLocaleString('zh-TW'),eventNames[e.kind]||e.kind,states[e.status]||e.status]){const td=document.createElement('td');td.textContent=v;row.appendChild(td)}const shot=document.createElement('td');if(e.snapshot_available){const a=document.createElement('a');a.href=`/care/events/${e.event_uid}/snapshot`;a.target='_blank';a.textContent='查看';shot.appendChild(a)}else shot.textContent='—';row.appendChild(shot);table.appendChild(row)}root.replaceChildren(table)}catch(e){document.getElementById('history').textContent='事件紀錄讀取失敗'}}
function renderPrivacy(d){document.getElementById('privacyStatus').textContent=d.skeleton?'目前為隱私骨架模式':'目前為正常影像模式';document.getElementById('privacySkeletonButton').disabled=!!d.skeleton;document.getElementById('privacyVideoButton').disabled=!d.skeleton}async function refreshPrivacy(){try{const r=await fetch('/care/privacy',{cache:'no-store'});renderPrivacy(await r.json())}catch(e){}}async function setPrivacyMode(mode){try{const r=await fetch('/care/privacy',{method:'POST',headers:{'Content-Type':'application/json','X-Care-Privacy':'1'},body:JSON.stringify({mode})}),d=await r.json();if(!r.ok)throw Error(d.error);renderPrivacy(d);document.getElementById('careImage').src='/care/video_feed?x='+Date.now()}catch(e){document.getElementById('privacyStatus').textContent=e.message}}async function followAction(a){try{const d=await postJson('/care/follow/'+a,{}, {'X-Care-Follow':'1'});document.getElementById('followStatus').textContent=d.message}catch(e){document.getElementById('followStatus').textContent=e.message}}function renderFollow(f){document.getElementById('followStatus').textContent=f.enabled?'人物前進模式已啟用｜'+(f.reason||''):f.target_visible?'已看到人，按「開始跟隨」即可前進':'人物前進模式尚未啟用';document.getElementById('followEnableButton').disabled=!!f.enabled}function renderRestZone(z){const o=document.getElementById('restOverlay');if(!z){o.style.display='none';return}o.style.display='block';o.style.left=z[0]*100+'%';o.style.top=z[1]*100+'%';o.style.width=(z[2]-z[0])*100+'%';o.style.height=(z[3]-z[1])*100+'%'}function beginRestZone(){selectingRest=true;restPoints=[];document.getElementById('careImage').classList.add('follow-selecting');document.getElementById('setupFeedback').textContent='請依序點選休息區左上角與右下角'}
async function refreshGeminiStatus(){try{const r=await fetch('/care/assistant/settings',{cache:'no-store'}),d=await r.json(),a=d.assistant||{};document.getElementById('geminiStatus').textContent=a.configured?`已設定｜模型：${a.model||'Gemini'}`:'尚未設定 Gemini API Key'}catch(e){document.getElementById('geminiStatus').textContent='無法讀取設定'}}async function saveGeminiKey(){const input=document.getElementById('geminiApiKey'),key=input.value.trim();if(!key){feedback('geminiFeedback','請貼上新的 API Key',true);return}try{const d=await postJson('/care/assistant/settings',{api_key:key},{'X-Care-Settings':'1'});input.value='';feedback('geminiFeedback',d.message);refreshGeminiStatus()}catch(e){feedback('geminiFeedback',e.message,true)}}
document.getElementById('careImage').addEventListener('click',async e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if(selectingRest){restPoints.push([x,y]);if(restPoints.length===1){document.getElementById('setupFeedback').textContent='已記錄左上角，請點右下角';return}selectingRest=false;e.currentTarget.classList.remove('follow-selecting');const a=restPoints[0],b=restPoints[1];try{const d=await postJson('/care/rest-zone',{x1:Math.min(a[0],b[0]),y1:Math.min(a[1],b[1]),x2:Math.max(a[0],b[0]),y2:Math.max(a[1],b[1])});document.getElementById('setupFeedback').textContent=d.message;renderRestZone(d.zone)}catch(err){document.getElementById('setupFeedback').textContent=err.message}}});async function clearRestZone(){try{const d=await postJson('/care/rest-zones/clear',{});document.getElementById('setupFeedback').textContent=d.message;renderRestZone(null)}catch(e){}}async function setBaseline(){try{const d=await postJson('/care/environment/baseline',{});document.getElementById('setupFeedback').textContent=d.message}catch(e){document.getElementById('setupFeedback').textContent=e.message}}
let tick=0;async function loop(){await refreshStatus();if(tick++%10===0)await Promise.all([refreshHistory(),loadMedications(),refreshPrivacy(),refreshGeminiStatus()]);setTimeout(loop,500)}initDays();renderConversation();loop();
</script></body></html>
